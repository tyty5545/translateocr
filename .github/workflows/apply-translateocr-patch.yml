
name: Apply TranslateOCR patch

on:
  push:
    branches:
      - master
    paths:
      - translateocr-github-patch.zip

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Extract patch
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path.cwd().resolve()
          archive = root / "translateocr-github-patch.zip"
          helper = root / ".github/workflows/apply-translateocr-patch.yml"

          if not archive.is_file():
              raise SystemExit("Patch ZIP not found")

          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  if info.is_dir():
                      continue

                  rel = PurePosixPath(info.filename)

                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit("Unsafe ZIP path")

                  target = (root / Path(*rel.parts)).resolve()

                  if root not in target.parents:
                      raise SystemExit("Invalid target path")

                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  target.write_bytes(zf.read(info.filename))

          archive.unlink()
          helper.unlink(missing_ok=True)

          print("Patch applied")

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Apply TranslateOCR improvements"
          git push origin HEAD:master
